name: EasyHealth CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend Tests & Build ────────────────────────────────────────────────
  frontend:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (28 tests)
        run: npx vitest run

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "✅ Frontend build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ── Backend Tests ─────────────────────────────────────────────────────────
  backend:
    name: Backend — Test & Health Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run Backend Foundation & Repository Tests
        run: npm run test:db

      - name: Run Integration & AI Evaluation Suite
        run: node src/scripts/integration-test.js

      - name: Start backend server
        run: node src/server.js &
        env:
          PORT: 5001
          JWT_SECRET: test-jwt-secret-for-ci-only
          NODE_ENV: development

      - name: Wait for server startup
        run: sleep 4

      - name: Health check
        run: |
          curl -f http://localhost:5001/api/health
          echo "✅ Backend health check passed"

      - name: Test public endpoints
        run: |
          curl -f "http://localhost:5001/api/doctors" > /dev/null
          curl -f "http://localhost:5001/api/emergency/hospitals" > /dev/null
          echo "✅ Public API endpoints working"

      - name: Test auth — login with demo credentials
        run: |
          curl -f -X POST http://localhost:5001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"patient@demo.com","password":"demo1234"}' | grep -q "token"
          echo "✅ Authentication working"

  # ── Deploy to Vercel ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
