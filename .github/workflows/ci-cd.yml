name: EasyHealth CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Test & Build Frontend
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

  # 2. Test Backend Node.js
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Verify Backend Syntax
        working-directory: ./backend
        run: node -c src/server.js

  # 3. Test AI Microservice Python FastAPI
  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: pip install -r requirements.txt

      - name: Python Syntax & Import Verification
        working-directory: ./ai-service
        run: python -m py_compile main.py services/*.py

  # 4. Docker Build & Security Scan
  docker-build:
    needs: [frontend-build, backend-test, ai-service-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Compose Images
        run: docker compose build
