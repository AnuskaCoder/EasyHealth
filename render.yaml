services:
  - type: web
    name: easyhealth-api
    env: node
    region: ohio
    buildCommand: "cd backend && npm install && npm start"
    startCommand: "cd backend && node src/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://easyhealth-xi.vercel.app
      - key: DATABASE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: easyhealth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: easyhealth-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AI_SERVICE_URL
        value: https://easyhealth-ai.onrender.com

  - type: web
    name: easyhealth-ai
    env: python
    region: ohio
    buildCommand: "cd ai-service && pip install -r requirements.txt"
    startCommand: "cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: easyhealth-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: CORS_ORIGINS
        value: https://easyhealth-xi.vercel.app
      - key: FRONTEND_URL
        value: https://easyhealth-xi.vercel.app

databases:
  - name: easyhealth-db
    databaseName: easyhealth
    user: easyhealth
    ipAllowList: []

  - name: easyhealth-redis
    plan: free
    region: ohio
    ipAllowList: []
