# Render Blueprint for the API, AI service, and PostgreSQL database.
# Deploy through Render Dashboard > New > Blueprint and review database pricing before creating resources.
services:
  - type: web
    name: easyhealth-api
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://easyhealth-xi.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: easyhealth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: easyhealth-ai
    runtime: docker
    branch: main
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /ai/health

# Use persistent PostgreSQL rather than Render's expiring free database for account/request data.
# Review the plan and price in Render before creating the Blueprint.
databases:
  - name: easyhealth-db
    databaseName: easyhealth
    user: easyhealth
    plan: 0.1c-256mb
