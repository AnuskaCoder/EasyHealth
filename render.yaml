# No-cost demo Blueprint for the API, AI service, and PostgreSQL database.
# Free Render Postgres expires after 30 days; do not store real patient data.
services:
  - type: web
    name: easyhealth-api
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://easyhealth-xi.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: easyhealth-db
          property: connectionString
      - key: DATABASE_MODE
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: easyhealth-ai
    runtime: docker
    branch: main
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /ai/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: easyhealth-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://easyhealth-xi.vercel.app
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: GEMINI_API_KEY
        sync: false

# Free Postgres is suitable only for a temporary demo, not production healthcare data.
databases:
  - name: easyhealth-db
    databaseName: easyhealth
    user: easyhealth
    plan: free
