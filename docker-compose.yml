version: '3.8'

# IMPORTANT: Copy .env.example to .env and fill in real values before running.
# Never commit .env to version control.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env        # Create from backend/.env.example
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://easyhealth:${POSTGRES_PASSWORD}@postgres:5432/easyhealth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: easyhealth
      POSTGRES_USER: easyhealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyhealth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: unless-stopped

  # Python AI service — enabled when OPENAI_API_KEY is configured
  # ai-service:
  #   build: ./ai-service
  #   ports: ["8000:8000"]
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #   depends_on: [backend]

volumes:
  postgres_data:
