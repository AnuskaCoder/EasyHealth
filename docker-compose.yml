version: '3.8'

services:
  # 1. Frontend: React.js, TypeScript, Tailwind CSS
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://backend:5000/api
      - VITE_AI_URL=http://ai-service:8000/ai
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped

  # 2. Backend: Node.js, Express.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://easyhealth_user:easyhealth_secure_pass_2026@postgres:5432/easyhealth_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=easyhealth-jwt-secret-key-2026-supersecure
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 3. AI/ML: Python, FastAPI, LLM API, RAG
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped

  # 4. Database: PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=easyhealth_user
      - POSTGRES_PASSWORD=easyhealth_secure_pass_2026
      - POSTGRES_DB=easyhealth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyhealth_user -d easyhealth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 5. Cache & Session Store: Redis 7
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
